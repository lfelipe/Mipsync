name: Windows validation

on:
  push:
    branches: [validation/ps1-renderer]

permissions:
  contents: read

jobs:
  validate:
    name: Build and test Mipsync
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 8cd6c338e85262d16b5b38ffeda4815c6654f4de
          persist-credentials: false
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Configure, build and test
        shell: pwsh
        run: |
          ./scripts/BuildEngine.ps1 -CompilerRoot '${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin' -Jobs 4
